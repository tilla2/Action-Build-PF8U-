name: CAll Build Start UP

on:
  workflow_dispatch:
    inputs:
      BATCH:
        description: "Batch parallel processing in groups of 9 - Select batch (1-4)"
        required: true
        default: "1"
      CONFIRMATION:
        description: "I have read the README.md, understand the risks and functions of this workflow, have the ability to cancel stuck workflow runs and delete caches, and insist on continuing."
        required: true
        default: "I have read the README.md, understand the risks and functions of this workflow, have the ability to cancel stuck workflow runs and delete caches, and insist on continuing."
        
permissions:
  actions: read
  contents: read
  
jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check User Confirmation
        run: |
          CONFIRM="${{ github.event.inputs.CONFIRMATION }}"
          EXPECT="I have read the README.md, understand the risks and functions of this workflow, have the ability to cancel stuck workflow runs and delete caches, and insist on continuing."
          
          if [[ "$CONFIRM" != "$EXPECT" ]]; then
            echo "❌ Invalid input, you have not correctly confirmed the workflow risks. Please read the changelog and enter the confirmation content correctly. If you only want to run a single device model, this is not the right place, please use the other workflow file in this repository: Build All OnePlus Kernels"
            exit 1
          fi
          
      - name: Set Matrix from FILE List
        id: set-matrix
        run: |
          BATCH="${{ github.event.inputs.BATCH }}"
          
          if [[ "$BATCH" == "1" ]]; then
            FILE_LIST=(
              "oneplus_nord_ce4_lite_5g_v"
              "oneplus_nord_ce4_v"
              "oneplus_nord_4_v"
              "oneplus_ace_3v_v"
              "oneplus_10_pro_v"
              "oneplus_10t_v"
              "oneplus_11r_v"
              "oneplus_ace2_v"
              "oneplus_ace_pro_v"
            )
          elif [[ "$BATCH" == "2" ]]; then
            FILE_LIST=(
              "oneplus_11_v"
              "oneplus_12r_v"
              "oneplus_ace2_pro_v"
              "oneplus_ace3_v"
              "oneplus_open_v"
              "oneplus_12_v"
              "oneplus_13r"
              "oneplus_ace3_pro_v"
              "oneplus_ace5"
            )
          elif [[ "$BATCH" == "3" ]]; then
            FILE_LIST=(
              "oneplus_pad_pro_v"
              "oneplus_pad2_v"
              "oneplus_nord_5"
              "oneplus_ace5_pro"
              "oneplus_ace5_pro_b"
              "oneplus_13"
              "oneplus_13_b"
              "oneplus_13t"
              "oneplus_13t_b"
            )
          elif [[ "$BATCH" == "4" ]]; then
            FILE_LIST=(
              "oneplus_13_global"
              "oneplus_13s"
              "oneplus_13s_b"
              "oneplus_pad_2_pro"
              "oneplus_pad_3"
              "oneplus_ace5_ultra"
              "oneplus_ace_6"
              "oneplus_15"
            )
          else
            echo "Invalid BATCH value: $BATCH"
            exit 1
          fi
          
          MATRIX_JSON=$(printf '%s\n' "${FILE_LIST[@]}" | jq -R -s -c '
            split("\n")[:-1] |
            map({
              file: .,
              file_short: (sub("_[a-z]$"; ""))
              enable_sched: (
                . == "oneplus_pad_2_pro" or
                . == "oneplus_13" or
                . == "oneplus_13_global" or
                . == "oneplus_13t" or
                . == "oneplus_13s" or
                . == "oneplus_ace5_ultra" or
                . == "oneplus_ace5_pro"
              )
            })
          ')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Call Original Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Build All OnePlus Kernels
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
             "FILE":  "${{ matrix.file }}",
             "SUSFS_CI":  "NoN",
             "KSU_META":  "susfs-main/Numbersf/",
             "BUILD_TIME":  "F",
             "SUFFIX":  "",
             "FAST_BUILD":  "true",
             "HOOK":  "manual",
             "LSM":  "true",
             "SCHED":  "${{ matrix.enable_sched }}",
             "ZRAM":  "false"
            }
            
      - name: Wait for Builds to Finish or Exit Early
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="${{ matrix.file_short }}"
          echo "Waiting for target build $FILE to upload corresponding Artifact..."
          
          SECONDS=0
          MAX_TIME=$((35 * 60))
          sleep 600
          
          while (( SECONDS < MAX_TIME )); do
            echo "Querying uploaded Artifacts (Waited $SECONDS seconds)..."
            ALL_ARTIFACTS=$(gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].name')
            
            if echo "$ALL_ARTIFACTS" | grep -E -q "$FILE"; then
              echo "✅ Found matching Artifact: $(echo "$ALL_ARTIFACTS" | grep -E "$FILE" | head -n1)"
              exit 0
            fi
            
            echo "No matching Artifact found, sleeping 5min and continuing..."
            sleep 300
          done
          
          echo "❌ Timed out waiting for successful build Artifact of $FILE."
          exit 1
          
      - name: Clean ccache After Build
        run: |
          echo "Cleaning ccache for $HOME/.ccache_${{ matrix.file }} ..."
          rm -rf "$HOME/.ccache_${{ matrix.file }}"
          
  wait-and-download:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup gh CLI
        run: |
          sudo apt update && sudo apt install -y gh zip curl jq
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          
      - name: List Matching Artifacts for Current Batch
        id: list-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Searching for Artifacts of current Batch..."
          mkdir -p all_artifacts
          
          BATCH="${{ github.event.inputs.BATCH }}"
          if [[ "$BATCH" == "1" ]]; then
            FILE_LIST=(
              "oneplus_nord_ce4_lite_5g_v"
              "oneplus_nord_ce4_v"
              "oneplus_nord_4_v"
              "oneplus_ace_3v_v"
              "oneplus_10_pro_v"
              "oneplus_10t_v"
              "oneplus_11r_v"
              "oneplus_ace2_v"
              "oneplus_ace_pro_v"
            )
          elif [[ "$BATCH" == "2" ]]; then
            FILE_LIST=(
              "oneplus_11_v"
              "oneplus_12r_v"
              "oneplus_ace2_pro_v"
              "oneplus_ace3_v"
              "oneplus_open_v"
              "oneplus_12_v"
              "oneplus_13r"
              "oneplus_ace3_pro_v"
              "oneplus_ace5"
            )
          elif [[ "$BATCH" == "3" ]]; then
            FILE_LIST=(
              "oneplus_pad_pro_v"
              "oneplus_pad2_v"
              "oneplus_nord_5"
              "oneplus_ace5_pro"
              "oneplus_ace5_pro_b"
              "oneplus_13"
              "oneplus_13_b"
              "oneplus_13t"
              "oneplus_13t_b"
            )
          elif [[ "$BATCH" == "4" ]]; then
            FILE_LIST=(
              "oneplus_13_global"
              "oneplus_13s"
              "oneplus_13s_b"
              "oneplus_pad_2_pro"
              "oneplus_pad_3"
              "oneplus_ace5_ultra"
              "oneplus_ace_6"
              "oneplus_15"
            )
          else
            echo "Invalid BATCH value: $BATCH"
            exit 1
          fi
          
          SHORT_LIST=()
          for FILE in "${FILE_LIST[@]}"; do
            SHORT=$(echo "$FILE" | sed -E 's/_[a-z]$//' | sed -E 's/_v$//')
            SHORT_LIST+=("$SHORT")
          done
          
          ALL_ARTIFACTS=$(gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].name')
          
          MATCHED_ARTIFACTS=()
          for FILE in "${SHORT_LIST[@]}"; do
            for ART in $ALL_ARTIFACTS; do
              if [[ "$ART" == *"$FILE"* ]]; then
                MATCHED_ARTIFACTS+=("$ART")
              fi
            done
          done
          
          if [[ "${#MATCHED_ARTIFACTS[@]}" -eq 0 ]]; then
            echo "No matching Artifacts, terminating"
            exit 1
          fi
          
          ARTIFACT_NAMES=$(IFS=";"; echo "${MATCHED_ARTIFACTS[*]}")
          echo "ARTIFACT_NAMES=$ARTIFACT_NAMES" >> "$GITHUB_OUTPUT"
          
      - name: Download All Matched Artifacts as ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p all_artifacts
          IFS=';' read -ra NAMES <<< "${{ steps.list-artifacts.outputs.ARTIFACT_NAMES }}"
          for NAME in "${NAMES[@]}"; do
            echo "Searching for ID of artifact $NAME..."
            ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/artifacts --jq ".artifacts[] | select(.name==\"$NAME\") | .id")
            if [[ -n "$ARTIFACT_ID" ]]; then
              echo "Downloading $NAME (ID: $ARTIFACT_ID)..."
              curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                   -o "all_artifacts/${NAME}.zip" \
                   "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
            else
              echo "ID for $NAME not found, skipping"
            fi
          done
          
      - name: Create Final ZIP from Extracted ZIPS
        run: |
          cd all_artifacts
          zip -r ../All-AnyKernel3-SukiSUUltra-${{ github.event.inputs.BATCH }}.zip ./*
          
      - name: Upload Combined ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: All-AnyKernel3-SukiSUUltra-${{ github.event.inputs.BATCH }}
          path: All-AnyKernel3-SukiSUUltra-${{ github.event.inputs.BATCH }}.zip
