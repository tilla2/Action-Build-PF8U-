name: Build All OnePlus Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "Configuration file"
        required: true
        default: oneplus_ace2_pro_b
        options:
          - oneplus_nord_n30_se_5g_v
          - oneplus_10r_v
          - oneplus_nord_3_b
          - oneplus_ace_v
          - oneplus_ace_race_v
          - oneplus_10_pro_b
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_pad_lite_b
          - oneplus_pad_mt6983_b
          - oneplus_ace_2v_b
          - oneplus_ace_pro_v
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_n6_b
          - oneplus_n6x_b
          - oneplus_12_b
          - oneplus_pad_go_2_b
          - oneplus_turbo_6x_b
          - oneplus_nord_ce4_lite_5g_b
          - oneplus_nord_ce6
          - oneplus_nord_ce6_lite_b
          - oneplus_turbo_6v
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_pad_mt6897_b
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_ce5_b
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_b
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_race_b
          - oneplus_ace5_ultra_b
          - oneplus_pad2_mt6991_b
          - oneplus_ace_6
          - oneplus_turbo_6
          - oneplus_nord_6
          - oneplus_ace_6t
          - oneplus_15r
          - oneplus_15
          - oneplus_15t
          - oneplus_pad_3_pro
          - oneplus_pad_4
          - oneplus_ace6_ultra
      CREATE_RELEASE:
        type: boolean
        description: "Do you want to create a release with build metadata?"
        required: true
        default: false
      SUSFS_CI:
        type: choice
        description: "SUSFS module branch"
        required: true
        default: N/A
        options:
          - CI
          - Release
          - N/A
      KPM:
        type: choice
        description: "Kernel module implementation method"
        required: true
        default: N/A
        options:
          - KPM
          - KPN
          - N/A
      SUSFS_META:
        type: string
        description: "Rollback SUSFS (Enter commit hash, count, or -1 to disable)"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "Manifest repository owner"
        required: true
        default: "Numbersf"
      BUILD_TIME:
        type: string
        description: "Custom build time (Enter F to use UTCT, or -1 to disable)"
        required: false
        default: "Fri Aug 7 11:37:03 UTC 2026"
      KSU_META:
        type: string
        description: "Manager Branch name (Required) / Builtin branch name (Required) / Custom version identifier (Leave blank to not modify) / Rollback branch commit hash version (Leave blank to not modify)"
        required: false
        default: "main/main/Numbersf/"
      LZ4_UPDATE:
        type: boolean
        description: "Upgrade LZ4 to the latest upstream?"
        required: true
        default: false
      ZRAM:
        type: string
        description: "ZRAM (0: disable, 1: enable) / Algorithm name / Size"
        required: true
        default: "0/lz4kd/8589934592"
      SUFFIX:
        type: string
        description: "Custom kernel suffix (Leave blank to use RAND_STR, or -1 to disable)"
        required: false
        default: ""
      RESUBLEVEL:
        description: "Custom kernel SUBLEVEL spoofing"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Enable ultra-fast build?"
        required: true
        default: true
      LSM_BBG:
        type: boolean
        description: "Enable critical partition write protection module (BBG)?"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "Enable network feature extensions (NETFILTER)?"
        required: true
        default: true
      CCM:
        type: boolean
        description: "Enable network congestion control and management mechanism (BBRv1+BBRv3+ECN)?"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "Add patch for Unicode invisible code point read bypass vulnerability?"
        required: true
        default: false
      SCHED_HMBIRD:
        type: boolean
        description: "Add Fengchi (HMBIRD) Driver 1.0?"
        required: true
        default: false
      DROID_SPACES:
        type: boolean
        description: "Add lightweight Linux container support (DroidSpaces)?"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "Add Re-Kernel?"
        required: true
        default: false
      SUSFS_DEV:
        type: boolean
        description: "Pull the SUSFS-DEV branch?"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable workspace cleaning?"
        required: true
        default: false
      BUILD_NOCACHE:
        type: boolean
        description: "Disable caching for this build?"
        required: true
        default: false
        
jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ contains(github.event.inputs.FILE, '_aosp') && ' [AOSP]' || '' }}${{ github.event.inputs.KPM == 'KPM' && ' [KPM]' || github.event.inputs.KPM == 'KPN' && ' [KPN]' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && ' [BBG]' || '' }}${{ github.event.inputs.SCHED_HMBIRD == 'true' && ' [HMBIRD]' || '' }}${{ github.event.inputs.DROID_SPACES == 'true' && ' [DS]' || '' }}${{ startsWith(github.event.inputs.ZRAM, '1/') && ' [ZRAM]' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && ' [REKER]' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && ' [LZ4UPD]' || '' }}For ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"
          mkdir kernel_workspace && cd kernel_workspace
          git clone https://github.com/Numbersf/Action-Build.git -b ReSukiSU

      - name: Extract Manifest Info
        id: extract_info
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_bak//g; /_aosp/{s/_aosp//g;s/$/(AOSP)/;}; s/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/RealME/; s/^oppo/OPPO/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "Processing FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV
          
          # Dynamically call source manifest repository, priority: 1️⃣ OnePlusOSS → 2️⃣ Dynamic → 3️⃣ Appendix
          DYNAMIC_REPO_INPUT="${{ github.event.inputs.DYNAMIC_REPO }}"
          declare -A REPOS
          REPOS["OnePlusOSS"]="OnePlusOSS|kernel_manifest"
          REPOS["Dynamic"]="${DYNAMIC_REPO_INPUT}|kernel_manifest"
          REPOS["Appendix"]="Numbersf|Kernel_Manifest_Appendix"
          
          FOUND_REPO=""
          FOUND_BRANCH=""
          
          check_repo() {
            local ENTRY=$1
            local OWNER=${ENTRY%%|*}
            local REPO_NAME=${ENTRY##*|}
            
            echo "🌐 Attempting to fetch branch list for ${OWNER}/${REPO_NAME}..."
            BRANCHES=$(git ls-remote --heads https://github.com/${OWNER}/${REPO_NAME}.git | sed 's|.*refs/heads/||')
            
            if [[ -z "$BRANCHES" ]]; then
              echo "⚠️ Failed to fetch branch list for ${OWNER}/${REPO_NAME}, please try running the workflow again."
              return 1
            fi
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/README.md"
              
              if curl -sf --head "$XML_URL" >/dev/null; then
                echo "✅ Found ${FILE}.xml in ${OWNER}/${REPO_NAME} (branch: ${BRANCH})"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true
                
                FOUND_REPO="$OWNER"
                FOUND_REPO_NAME="$REPO_NAME"
                FOUND_BRANCH="$BRANCH"
                
                return 0
              fi
            done
            return 1
          }
          if ! check_repo "${REPOS["OnePlusOSS"]}"; then
            if ! check_repo "${REPOS["Dynamic"]}"; then
              check_repo "${REPOS["Appendix"]}"
            fi
          fi
          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "❌ Could not find ${FILE}.xml in any repository"
            exit 8
          fi
          echo "MANIFEST_REPO=$FOUND_REPO" >> "$GITHUB_ENV"
          echo "MANIFEST_REPO_NAME=$FOUND_REPO_NAME" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> "$GITHUB_ENV"
          
          # Parse revision string
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "Parsing FILE to get CPU and ANDROID_VERSION..."
          # Extract CPU
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # Extract ANDROID_VERSION
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d+\.\d+(\.\d+)?')
          if [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; then
            echo "✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            # Get short Android version number
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          else
            echo "❌ Could not extract CPU or ANDROID_VERSION from revision"
            exit 1
          fi
          
          echo "Parsing README.md to get CPUD and BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "❌ Build command not found in README.md"
            fi
          else
            echo "❌ README.md download failed or is empty"
          fi
          
          # Pass combined information
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        env:
          BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}
          SUFFIX: ${{ github.event.inputs.SUFFIX }}
        run: |
          echo "------------------------------"
          
          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          if [ "${{ github.event.inputs.SUSFS_CI }}" != "N/A" ]; then
            echo "::warning title=SUSFS Not Required::The current manager already includes additional modules, no need to enable the SUSFS module. Forcing it may cause boot failure."
          fi
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"
          echo "Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected LSM_BBG: ${{ github.event.inputs.LSM_BBG }}"
          echo "Selected NETFILTER: ${{ github.event.inputs.NETFILTER }}"
          echo "Selected CCM: ${{ github.event.inputs.CCM }}"
          echo "Selected SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}"
          echo "Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "Selected SCHED_HMBIRD: ${{ github.event.inputs.SCHED_HMBIRD }}"
          echo "Selected UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}"
          echo "Selected DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}"
          echo "Selected RE_KERNEL: ${{ github.event.inputs.RE_KERNEL }}"
          echo "Selected LZ4_UPDATE: ${{ github.event.inputs.LZ4_UPDATE }}"
          echo "Custom BUILD_TIME: $BUILD_TIME"
          echo -n "BUILD_TIME Unicode: "
          CHECK_TEXT="$BUILD_TIME" python3 "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py" --mode build_time
          echo "Custom SUFFIX: $SUFFIX"
          echo -n "SUFFIX Unicode: "
          CHECK_TEXT="$SUFFIX" python3 "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py" --mode suffix

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Fork Check
        run: |
          repo="${{ github.repository }}"; json=$(curl -s "https://api.github.com/repos/$repo")
          parent=$(echo "$json" | grep -o '"full_name": *"[^"]*"' | head -n 2 | tail -n 1 | sed 's/.*"full_name": *"\([^"]*\)".*/\1/')
          if [ -n "$parent" ] && [ "$parent" != "Numbersf/Action-Build" ]; then
            echo "::warning title=Source Warning::The kernel compilation address you are using is an unofficial source, which may cause run failures or kernel anomalies."
          fi

      - name: Reject Check
        run: |
          REJ_CHECKER="$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_rejects.sh"
          chmod +x "$REJ_CHECKER"
          echo "REJ_CHECKER=$REJ_CHECKER" >> $GITHUB_ENV

      - name: Restore APT Cache
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: ~/.apt-pkg-cache
          key: apt-cache-${{ runner.os }}-${{ github.ref_name }}-v6

      - name: Install Dependencies
        run: |
          export APT_PACKAGES="python3 git curl libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves"
          bash "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/cache_apt_pkgs.sh" ~/.apt-pkg-cache

      - name: Setup Kotlin
        run: |
          KOTLIN_VERSION="2.4.10"
          curl -sL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o kotlinc.zip
          unzip -q kotlinc.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Setup Ccache-ECS
        run: |
         LIB_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/lib"
         sudo cp -f "$LIB_DIR/ccache" /usr/bin/ccache && sudo chmod +x /usr/bin/ccache

      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.8

      - name: Restore ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' }}
        id: restore-thinlto
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-16.9

      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "Initializing ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache initialization completed"
            else
              echo "✅ ccache already initialized, skipping"
            fi
          else
            echo "❌ ccache not installed, skipping"
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          BASE_URL="https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git"
          
          echo "Initializing repository using $MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --depth=1 --no-clone-bundle --no-tags
          sed -i -e '/prebuilts\/asuite"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' -e '/tools\/tradefederation\/prebuilts"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' ".repo/manifests/${FILE}.xml"
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync
          
          KERNEL_REPOS=""
          KERNEL_REPOS_PATH=$(find . -type f -name "build.config.msm.common" | head -n 1)
          if [[ -n "$KERNEL_REPOS_PATH" ]]; then
            KERNEL_REPOS=$(echo "${KERNEL_REPOS_PATH#./}" | cut -d/ -f2)
            echo "✅ Found build.config.msm.common: $KERNEL_REPOS_PATH"
            echo "✅ KERNEL_REPOS=$KERNEL_REPOS"
            echo "KERNEL_REPOS=$KERNEL_REPOS" >> "$GITHUB_ENV"
          else
            echo "❎ build.config.msm.common not found, it might be a Dimensity manifest or pure Kleaf build structure"
          fi
          
          # Remove ABI protection
          for dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done
          
          # Remove build review
          if grep -q 'check_defconfig' kernel_platform/common/build.config.gki; then
            sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki
          fi
          if grep -q 'check_defconfig = None,' kernel_platform/build/kernel/kleaf/common_kernels.bzl; then
            sed -i 's/check_defconfig = None,/check_defconfig = "disabled",/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
            sed -i 's/if check_defconfig == None:/if False:  # check_defconfig == None:/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
          fi

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          echo "EFFECTIVE_SUFFIX=${{ github.event.inputs.SUFFIX }}" >> "$GITHUB_ENV"
          # Get kernel Android version (KANDROID_VERSION) and kernel version (KERNEL_VERSION 2 digits)
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              KMI=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$KMI" ] && break
            fi
          done
          if [[ -z "$KMI" && -n "$KERNEL_REPOS" ]]; then
            KMI=$(grep -m1 '^android' "./$KERNEL_REPOS/android/ACK_SHA" | cut -d- -f1,2)
          fi
          if [ -n "$KMI" ]; then
            echo "KMI=$KMI" >> $GITHUB_ENV
            echo "KANDROID_VERSION=${KMI%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${KMI#*-}" >> $GITHUB_ENV
          else
            echo "No KMI found in build.config* and ACK_SHA files"
          fi
          
          # Get full kernel version (CD) from Makefile and split
          VERSIONLEVEL=$(awk '/^VERSION =/ {print $3}' ./common/Makefile)
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/ {print $3}' ./common/Makefile)
          SUBLEVEL=$(awk '/^SUBLEVEL =/ {print $3}' ./common/Makefile)
          echo "VERSIONLEVEL=$VERSIONLEVEL" >> $GITHUB_ENV
          echo "PATCHLEVEL=$PATCHLEVEL" >> $GITHUB_ENV
          # SUBLEVEL only passes the value before modification, because spoofing does not affect the original source state
          echo "SUBLEVEL=$SUBLEVEL" >> $GITHUB_ENV
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          
          # Force modify SUBLEVEL (kernel level)
          RESUBLEVEL="${{ github.event.inputs.RESUBLEVEL }}"
          if [ -n "$RESUBLEVEL" ]; then
            echo "Modifying SUBLEVEL to $RESUBLEVEL"
            sed -i "s/^SUBLEVEL[[:space:]]*=[[:space:]]*.*/SUBLEVEL = $RESUBLEVEL/" ./common/Makefile
          else
            echo "SUBLEVEL not specified, keeping default"
          fi
          
          # Read modified version
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          # CKERNEL_VERSION (3 digits): Full kernel version after modification or unmodified, used to spoof the system
          # DKERNEL_VERSION (3 digits): Full kernel version before modification, real value
          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "CKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "DKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "CKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi
          
          # Numeric conversion of kernel version, only the first two digits do not include SUBLEVEL
          echo "KERNEL_SHORT_PATCH_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV

      - name: Rust Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # Read RUSTC_VERSION from build.config.constants
          RUSTC_VERSION=""
          if [[ -f ./common/build.config.constants ]]; then
            RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [[ -n "$RUSTC_VERSION" ]]; then
            echo "✅ RUSTC_VERSION (original)=$RUSTC_VERSION"
            RUSTC_DIR_VERSION=$(echo "$RUSTC_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            if [[ -z "$RUSTC_DIR_VERSION" ]]; then
              RUSTC_DIR_VERSION="$RUSTC_VERSION"
            fi
            echo "✅ RUSTC_DIR_VERSION (for directory matching)=$RUSTC_DIR_VERSION"
            echo "RUSTC_VERSION=$RUSTC_VERSION" >> $GITHUB_ENV
            echo "RUSTC_DIR_VERSION=$RUSTC_DIR_VERSION" >> $GITHUB_ENV
            echo "ENABLE_RUST=true" >> $GITHUB_ENV
          else
            echo "✅ RUSTC_VERSION not found, Rust compilation disabled"
            echo "ENABLE_RUST=false" >> $GITHUB_ENV
          fi

      # Custom kernel suffix
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.SUFFIX != '' && github.event.inputs.SUFFIX != '-1' }}
        run: |
          cd kernel_workspace/kernel_platform
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"
          
          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"
            
            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
            
            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting suffix via cut/echo"
                if [[ -f ./build_with_bazel.py ]]; then
                  echo "When using the official script and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens."
                fi
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      # Random suffix in pseudo-official format (only effective when SUFFIX is not set)*
      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.SUFFIX == '' }}
        run: |
          cd kernel_workspace/kernel_platform
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"
          
          # Generate random number and random hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"
          echo "EFFECTIVE_SUFFIX=${RANDOM_SUFFIX}" >> "$GITHUB_ENV"
          
          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"
            
            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
            
            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res with random suffix"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting random suffix via cut/echo"
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      - name: Add ReSukiSU
        run: |
          cd kernel_workspace/kernel_platform
          KSU_META="${{ github.event.inputs.KSU_META }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"
          
          # Must contain two separators (at least four fields)
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 3 ]]; then
            echo "Error: KSU_META parameter is missing the necessary separator '/', format should be: Manager branch name/Builtin branch name/Custom identifier (optional)/Commit hash (optional)"
            exit 10
          fi
          
          # Parse fields: branch / custom identifier / manual hash
          IFS='/' read -r KSU_MANAGER_BRANCH KSU_BUILTIN_BRANCH KSU_CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          echo "KSU_MANAGER_BRANCH=$KSU_MANAGER_BRANCH" >> $GITHUB_ENV
          echo "KSU_BUILTIN_BRANCH=$KSU_BUILTIN_BRANCH" >> $GITHUB_ENV
          [[ -n "$KSU_CUSTOM_TAG" ]] && echo "Custom version identifier: $KSU_CUSTOM_TAG" || echo "Custom version identifier: Not enabled"
          [[ -n "$MANUAL_HASH" ]] && echo "Manually specified hash: $MANUAL_HASH" || echo "Manually specified hash: Not enabled"
          
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${KSU_MANAGER_BRANCH}/kernel/setup.sh" | bash -s "$KSU_BUILTIN_BRANCH"
          cd ./KernelSU
          
          if [[ -n "$KSU_CUSTOM_TAG" ]]; then
            echo "KSU_CUSTOM_TAG=$KSU_CUSTOM_TAG" >> "$GITHUB_ENV"
          fi
          if [[ -n "$MANUAL_HASH" ]]; then
            git fetch origin "$KSU_BUILTIN_BRANCH" --depth=50
            git checkout "$MANUAL_HASH"
          fi
          
          KSU_VERSION=$(expr $(git rev-list --count "$KSU_MANAGER_BRANCH" 2>/dev/null || echo 13000) + 30700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          if [ "$FAST_BUILD" = "false" ]; then
            KSU_SRC="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/KernelSU/kernel"
            if [[ -f "$KSU_SRC/Kbuild" ]]; then
              sed -i 's/-dirty//g' "$KSU_SRC/Kbuild"
              sed -i "s|^KSU_SRC :=.*|KSU_SRC := $KSU_SRC|" "$KSU_SRC/Kbuild"
            fi
          fi

      - name: Apply Fake Patches
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        run: |
          kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" apply "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

      - name: Apply Patches ReSukiSU
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{ github.event.inputs.SUSFS_DEV == 'true' && '-dev' || '' }}
            cd susfs4ksu
            if [ -n "$SUSFS_META" ]; then
              if [[ "$SUSFS_META" =~ ^[0-9]+$ ]]; then
                git checkout HEAD~$SUSFS_META
              else
                git checkout "$SUSFS_META"
              fi
            else
              echo "SUSFS_META is empty, using latest upstream SUSFS"
            fi
            cd ..
          fi
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            git clone https://github.com/Sakion-Team/Re-Kernel.git
          fi
          if [ "${{ github.event.inputs.LZ4_UPDATE }}" = "true" ]; then
            git clone https://github.com/Numbersf/lz4_oplus.git
          fi
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "Pulling susfs patch"
            cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          fi
          
          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            echo "Pulling zram patch"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi
          
          cd ./common
          
          if [ "$KMI" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "Fixing some bugs caused by kernel version 5.15.0~5.15.123 only supporting old C libraries"
            cp "${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/fix_5.15.legacy" ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
            echo "fix_5.15_patch completed"
          fi
          
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "Applying susfs patch"
            patch -p1 < 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            echo "susfs_patch completed"
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Revert and Postfix Fake Patches
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        run: |
          kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" postfix "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" revert "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

      # OGKI to GKI conversion, no need to modify dtbo boot
      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ (fromJSON(env.VERSIONLEVEL) > 6 || (fromJSON(env.VERSIONLEVEL) == 6 && fromJSON(env.PATCHLEVEL) >= 6)) && github.event.inputs.SCHED_HMBIRD == 'false' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "Fengchi code already exists in the source, enabling secondary fallback"
              exit 0
            }
          done
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          echo "Applying OGKI to GKI conversion patch"
          patch -p1 -F 3 < "${PATCH_DIR}/hmbird_patch.patch" || true
          echo "OGKI to GKI_patch completed"
          source $REJ_CHECKER
          check_rejects .

      - name: Apply BBRv3
        if: ${{ github.event.inputs.CCM == 'true' && env.KMI != 'android16-6.12' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          patch -p1 < "${PATCH_DIR}/bbrv3/0001-net-tcp-backport-BBRv3-to-$KMI.patch"
          if [ "$KMI" = "android12-5.10" ]; then
            if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
              patch -p1 < "${PATCH_DIR}/bbrv3/sysctl_add_proc_dou8vec_minmax.patch"
              patch -p1 < "${PATCH_DIR}/bbrv3/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch"
            fi
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply UNICODE_BYPASS
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [ "$VERSIONLEVEL" -lt 6 ]; then
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          RE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source"
          cd kernel_workspace/kernel_platform/common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          cp -r "${RE_DIR}"/* drivers/rekernel/
          if [ -f BUILD.bazel ]; then
            sed -i '0,/name = "kernel_aarch64",/{/module_implicit_outs/s|,$| + ["drivers/rekernel/rekernel.ko"],|}' BUILD.bazel
          fi

      - name: Apply DROID_SPACES
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.DROID_SPACES == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          # Comment out original sysv struct definitions
          sed -i 's/^\(\t\)struct sysv_sem\b.*sysvsem;/\1\/\/ struct sysv_sem\t\t\tsysvsem;/' include/linux/sched.h
          sed -i 's/^\(\t\)struct sysv_shm\b.*sysvshm;/\1\/\/ struct sysv_shm\t\t\tsysvshm;/' include/linux/sched.h
          
          if [ "$KMI" = "android12-5.10" ]; then
            echo "Fixing sysvipc KABI bypass and POSIX_MQUEUE ABI padding issues for android12-5.10..."
            sed -i '/^\tconst struct sched_class\t\*sched_class;/a \\n#ifndef __GENKSYMS__\n\tstruct sysv_sem\t\t\tsysvsem;\n\tstruct sysv_shm\t\t\tsysvshm;\n#endif\n' include/linux/sched.h
            sed -i 's/^\tunsigned long mq_bytes;\t\/\* How many bytes can be allocated to mqueue[?] \*\//\t\/\/unsigned long mq_bytes;\t\/* How many bytes can be allocated to mqueue? *\//' include/linux/sched/user.h
            sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1, 2);/{/^\tANDROID_KABI_RESERVE(1);/{N;N;s/^\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);/#if defined(CONFIG_POSIX_MQUEUE)\n\tANDROID_KABI_USE(1, unsigned long mq_bytes);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#endif/}}' include/linux/sched/user.h
          # Check sched.h and modify KABI slots or pointers
          elif grep -q "sched_dl_entity.*\*dl_server" include/linux/sched.h; then
            echo "✅ Detected dl_server pointer, using packed union scheme"
            sed -i 's|\tstruct sched_entity\t\tse;|#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n\n\tstruct sched_entity\t\tse;|' include/linux/sched.h
          elif grep -q "ANDROID_KABI_USE(1," include/linux/sched.h; then 
            echo "✅ Detected USE(1), using slots 6,7,8"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(1);" include/linux/sched.h; then
            echo "✅ Detected RESERVE(1), using slots 1,2,3"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(3);" include/linux/sched.h; then
            echo "✅ fallback, using slots 3,4,5"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif\n\tANDROID_KABI_RESERVE(6);|;}' include/linux/sched.h
          else
            echo "❌ Could not precisely match KABI slots or corresponding pointers through context"
            exit 9
          fi
          
          echo "Returning ghost tasks for oplus_bsp_midas module to avoid null pointer crashes..."
          patch -p1 --forward < "${PATCH_DIR}/ghost-task-for-midas.patch" || true
          
          if [ "$KMI" = "android16-6.12" ]; then
            rm -f include/uapi/linux/ntsync.h
            rm -f drivers/misc/ntsync.c
            echo "Completing IPC NS symbol exports..."
            if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' ./ipc/namespace.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> ./ipc/namespace.c
            fi
            if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' ./ipc/msgutil.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> ./ipc/msgutil.c
            fi
          fi
          echo "Extending ntsync support..."
          patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_base.patch" || true
          if [[ "$FILE" == oneplus_10r* ]]; then
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_android12-5.10_14.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_$([ -f "${PATCH_DIR}/ntsync/ntsync_compat_${KMI}_${ANDROID_SHORT_VERSION}.patch" ] && echo "${KMI}_${ANDROID_SHORT_VERSION}" || echo "${KMI}").patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply LZ4_DEV
        if: ${{ github.event.inputs.LZ4_UPDATE == 'true' }}
        run: |
          set -euo pipefail
          LZ4_REPO="${GITHUB_WORKSPACE}/kernel_workspace/lz4_oplus"
          cd kernel_workspace/kernel_platform/common
          . "${LZ4_REPO}/apply_lz4_oplus.sh"

      - name: Apply ZRAM
        if: startsWith(github.event.inputs.ZRAM, '1/')
        run: |
          ZRAM="${{ github.event.inputs.ZRAM }}"
          if [[ "$(grep -o '/' <<< "$ZRAM" | wc -l)" -lt 2 ]]; then
            echo "Error: ZRAM parameter is missing the necessary separator '/', format should be: Master switch 0 off 1 on/Algorithm name (invalid if 0 is entered before)/Size (invalid if 0 is entered before)"
            exit 10
          fi
          # Parse fields: switch status / algorithm name / size
          IFS='/' read -r ZRAM_SWSTA ZRAM_ALGO ZRAM_SIZE <<< "$ZRAM"
          echo "ZRAM_ALGO=$ZRAM_ALGO" >> $GITHUB_ENV
          echo "ZRAM_ALGO_U=${ZRAM_ALGO^^}" >> $GITHUB_ENV
          echo "ZRAM_SIZE=$ZRAM_SIZE" >> $GITHUB_ENV
          
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform/common
          if [[ "$KERNEL_VERSION" == "5.10" && "${CPU}" == mt* ]]; then
            sed -i 's/select CRYPTO_LZO/depends on CRYPTO_LZO/' ./mm/oplus_mm/hybridswap_zram/Kconfig
          fi
          echo "Applying lz4kd patch"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4kd.patch" || true
          echo 'lz4kd_patch completed'
          echo "Applying lz4k_oplus patch"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4k_oplus.patch" || true
          echo 'lz4k_oplus_patch completed'
          source $REJ_CHECKER
          check_rejects .

      - name: Apply SCHED_HMBIRD
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.SCHED_HMBIRD == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          CLEAN_FILE="${FILE//_bak/}"
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "Fengchi code already exists in the source, enabling secondary fallback"
              exit 0
            }
          done
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b $CPU || { echo "❌ CPU branch does not exist, Fengchi kernel does not support your model yet, please turn it off and retry"; exit 11; }
          echo "Pulling Fengchi patch"
          cp ./SCHED_PATCH/fengchi_${CLEAN_FILE}.patch ./
          if [[ -f "fengchi_${CLEAN_FILE}.patch" ]]; then
            echo "Applying Fengchi patch"
            dos2unix "fengchi_${CLEAN_FILE}.patch"
            patch -p1 -F 3 < "fengchi_${CLEAN_FILE}.patch"
            echo "fengchi_patch completed"
            source $REJ_CHECKER
            check_rejects .
          else
            echo "❌ Patch not matched, Fengchi kernel does not support your model yet, please turn it off and retry"
            exit 12
          fi

      - name: Apply LSM_BBG
        if: ${{ github.event.inputs.LSM_BBG == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "Enabling kernel-level baseband protection support…"
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig

      # Configuration information, items marked with * are additional items, with certain risks and uncertainties
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          MAKEFILE=./kernel/Makefile
          
          declare -a HIDE_CONFIGS=()
          
          set_config() {
            local val="$1"
            local key="${val%%=*}"
            if grep -qF "${key}=" "$CONFIG_FILE" || grep -qF "# ${key} is not set" "$CONFIG_FILE"; then
              VAL="$val" awk -v key="$key" '
                $0 == "# " key " is not set" || index($0, key "=") == 1 { print ENVIRON["VAL"]; next }
                { print }
              ' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE" || rm -f "${CONFIG_FILE}.tmp"
            else
              printf '%s\n' "$val" >> "$CONFIG_FILE"
            fi
          }
          
          set_hide_config() {
            local val="$1"
            local key="${val%%=*}"
            set_config "$val"
            HIDE_CONFIGS+=("$key")
          }
          
          inject_fake_config() {
            [ "${#HIDE_CONFIGS[@]}" -eq 0 ] && return 0
            local marker="# --- fake_config injector ---"
            if ! grep -qF "$marker" "$MAKEFILE"; then
              {
                printf '\n%s\n' "$marker"
                printf 'ifneq ($(strip $(CONFIG_FAKE_DISABLE)),)\n'
                printf '$(obj)/config_data: $(KCONFIG_CONFIG) FORCE\n'
                printf '\t$(Q)sed $(foreach opt,$(CONFIG_FAKE_DISABLE),-e '"'"'s|^$(opt)=.*|# $(opt) is not set|'"'"') $(KCONFIG_CONFIG) > $@\n'
                printf 'endif\n'
              } >> "$MAKEFILE"
            fi
            echo "CONFIG_FAKE_DISABLE=${HIDE_CONFIGS[*]}" >> "$GITHUB_ENV"
          }
          trap 'inject_fake_config' EXIT
          
          # ReSukiSU configuration
          set_config "CONFIG_KSU=y"
          set_config "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y"
          set_config "CONFIG_KSU_TOOLKIT_SUPPORT=y"
          if [[ -n "$KSU_CUSTOM_TAG" ]]; then
            set_config "CONFIG_KSU_FULL_NAME_FORMAT=\"%TAG_NAME%-${KSU_CUSTOM_TAG}@${KSU_BUILTIN_BRANCH}[%COMMIT_SHA%]\""
          fi
          
          # KPM configuration
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ] || [ "${{ github.event.inputs.KPM }}" = "N/A" ]; then
            set_config "CONFIG_KPM=y"
          fi
          if [ "${{ github.event.inputs.KPM }}" = "KPN" ]; then
            set_config "CONFIG_KPM=n"
          fi
          
          # SUSFS configuration
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            set_config "CONFIG_KSU_SUSFS=y"
            set_config "CONFIG_KSU_SUSFS_SUS_PATH=y"
            set_config "CONFIG_KSU_SUSFS_SUS_MAP=y"
            set_config "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            set_config "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            set_config "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            set_config "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            set_config "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          else
            set_config "CONFIG_KSU_SUSFS=n"
          fi
          
          # TMPFS configuration*
          set_config "CONFIG_TMPFS_XATTR=y"
          set_config "CONFIG_TMPFS_POSIX_ACL=y"
          
          # BBR & ECN configuration*
          if [ "${{ github.event.inputs.CCM }}" = "true" ]; then
            set_hide_config "CONFIG_TCP_CONG_ADVANCED=y"
            set_config "CONFIG_TCP_CONG_BBR=y"
            if [ "$KMI" != "android16-6.12" ]; then
              set_config "CONFIG_TCP_CONG_BBR3=y"
            fi
            set_config "CONFIG_NET_SCH_FQ=y"
            set_config "CONFIG_TCP_CONG_BIC=n"
            set_config "CONFIG_TCP_CONG_WESTWOOD=n"
            set_config "CONFIG_TCP_CONG_HTCP=n"
            set_config "CONFIG_IP_ECN=y"
            set_config "CONFIG_TCP_ECN=y"
            set_config "CONFIG_IPV6_ECN=y"
            set_config "CONFIG_IP_NF_TARGET_ECN=y"
          fi
          
          # Re-Kernel configuration*
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            set_config "CONFIG_REKERNEL=y"
            set_config "CONFIG_REKERNEL_NETWORK=y"
          fi
          
          # ZRAM configuration*
          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            set_config "CONFIG_CRYPTO_LZ4HC=y"
            set_config "CONFIG_CRYPTO_LZ4K=y"
            set_config "CONFIG_CRYPTO_LZ4KD=y"
            set_config "CONFIG_CRYPTO_842=y"
            set_config "CONFIG_CRYPTO_LZ4K_OPLUS=y"
            set_config "CONFIG_ZRAM_WRITEBACK=y"
          fi
          
          # LSM configuration*
          if [ "${{ github.event.inputs.LSM_BBG }}" = "true" ]; then
            set_config "CONFIG_BBG=y"
          fi
          
          # DROID_SPACES configuration*
          if [ "${{ github.event.inputs.DROID_SPACES }}" = "true" ]; then
            set_config "CONFIG_NTSYNC=y"
            set_config "CONFIG_SYSVIPC=y"
            set_config "CONFIG_DEVTMPFS=y"
            set_config "CONFIG_PID_NS=y"
            set_config "CONFIG_IPC_NS=y"
            set_config "CONFIG_USER_NS=y"
            set_config "CONFIG_NAMESPACES=y"
            set_config "CONFIG_POSIX_MQUEUE=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            set_config "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
          fi
          
          # IPSET & IPv6_NAT & TTL configuration*
          if [ "${{ github.event.inputs.NETFILTER }}" = "true" ]; then
            if [[ "$KERNEL_VERSION" != "6.12" && "${CPU}" != mt* ]]; then
              set_config "CONFIG_BPF_STREAM_PARSER=y"
            fi
            set_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            set_config "CONFIG_NETFILTER_XT_SET=y"
            set_config "CONFIG_IP_SET=y"
            set_config "CONFIG_IP_SET_MAX=65534"
            set_config "CONFIG_IP_SET_BITMAP_IP=y"
            set_config "CONFIG_IP_SET_BITMAP_IPMAC=y"
            set_config "CONFIG_IP_SET_BITMAP_PORT=y"
            set_config "CONFIG_IP_SET_HASH_IP=y"
            set_config "CONFIG_IP_SET_HASH_IPMARK=y"
            set_config "CONFIG_IP_SET_HASH_IPPORT=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTIP=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_IPMAC=y"
            set_config "CONFIG_IP_SET_HASH_MAC=y"
            set_config "CONFIG_IP_SET_HASH_NETPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_NET=y"
            set_config "CONFIG_IP_SET_HASH_NETNET=y"
            set_config "CONFIG_IP_SET_HASH_NETPORT=y"
            set_config "CONFIG_IP_SET_HASH_NETIFACE=y"
            set_config "CONFIG_IP_SET_LIST_SET=y"
            set_hide_config "CONFIG_IP6_NF_NAT=y"
            set_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_HL=y"
            set_config "CONFIG_IP_NF_TARGET_TTL=y"
            set_config "CONFIG_IP6_NF_TARGET_HL=y"
            set_config "CONFIG_NETFILTER_XT_MATCH_HL=y"
            set_config "CONFIG_IP_NF_MATCH_TTL=y"
            set_config "CONFIG_IP6_NF_MATCH_HL=y"
            set_config "CONFIG_IP_NF_MANGLE=y"
            set_config "CONFIG_IP6_NF_MANGLE=y"
          fi
          
          # Build dependency adjustments and optimizations
          if [ "$KERNEL_VERSION" = "5.15" ] && [[ "$CPU" == mt* ]]; then
            set_config "CONFIG_OPLUS_SYSTEM_KERNEL=y"
            set_config "CONFIG_OPLUS_FEATURE_CMDLINE=m"
            set_config "CONFIG_OPLUS_FEATURE_OPLUSBOOT=m"
            set_config "CONFIG_OPLUS_FEATURE_BUILDVARIANT=m"
            set_config "CONFIG_OPLUS_FEATURE_OPROJECT=m"
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            set_config "CONFIG_RUST=y"
            set_config "CONFIG_ANDROID_BINDER_IPC_RUST=m"
          fi
          
          # Custom kernel build time, without adding #1 SMP PREEMPT
      - name: Custom BUILD_TIME
        if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in ./common/scripts/mkcompile_h ./"$KERNEL_REPOS"/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          echo "Disabling GPUEB for MTK kernel 5.10"
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile

      - name: Build Kernel FAST
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          cd kernel_workspace/kernel_platform
          
          # Auto detect LLVM_IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi
          
          # Force recursive path
          CLANG_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/clang/host/linux-x86' \; -print | head -1)
          CLANG_PREBUILT_NAME=$(basename "${CLANG_PREBUILT_NAME:-}")
          echo "✅ CLANG_PREBUILT_NAME=$CLANG_PREBUILT_NAME"
          
          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/kernel-build-tools' \; -print | head -1)
          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(basename "${KERNEL_BUILD_TOOLS_PREBUILT_NAME:-}")
          echo "✅ KERNEL_BUILD_TOOLS_PREBUILT_NAME=$KERNEL_BUILD_TOOLS_PREBUILT_NAME"
          
          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUST_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/rust' \; -print | head -1)
            RUST_TOOLS_PREBUILT_NAME=$(basename "${RUST_TOOLS_PREBUILT_NAME:-}")
            echo "✅ RUST_TOOLS_PREBUILT_NAME=$RUST_TOOLS_PREBUILT_NAME"
          fi
          
          # Read CLANG_PREBUILT_BIN from build.config.common, or use recursive path fallback
          CLANG_PREBUILT_BIN=""
          if [[ -f ./common/build.config.common ]]; then
            CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common | cut -d'=' -f2-)
          fi
          
          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            CLANG_PREBUILT_BIN="${CLANG_PREBUILT_NAME}/clang/host/linux-x86/clang-zakozako/bin"
          fi
          
          # First try to identify clang-r from CLANG_PREBUILT_BIN, then remove clang-, as CLANG_VERSION
          if [[ "$CLANG_PREBUILT_BIN" =~ clang-(r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            # If not matched, try to extract from build.config.constants
            if [[ -f ./common/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi
          
          if [[ -z "$CLANG_VERSION" ]]; then
            echo "⚠️ Could not get Clang version from CLANG_PREBUILT_BIN or build.config.constants, falling back to official build script"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "Please consider turning off FAST_BUILD and submitting an issue"
            exit 0
          fi
          
          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}"
          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/clang-zakozako/clang-${CLANG_VERSION}}"
          
          echo "✅ CLANG_PREBUILT_BIN=$CLANG_PREBUILT_BIN"
          echo "✅ CLANG_VERSION=$CLANG_VERSION"
          echo "✅ USE_LLVM_IAS=$USE_LLVM_IAS"
          
          set +u
          source "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh" 2>/dev/null || true
          set -u
          
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          CLANG_LIB_PATH="${CLANG_PREBUILT_BIN%/bin}"
          if [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib"
          elif [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib"
          else
            export LIBCLANG_PATH="$(clang --print-resource-dir 2>/dev/null | sed 's|/lib/clang/.*||')/lib"
            echo "⚠️ LIBCLANG_PATH fallback to system: $LIBCLANG_PATH"
          fi
          echo "✅ LIBCLANG_PATH=$LIBCLANG_PATH"
          export PATH="/usr/lib/ccache:$PATH"
          
          # BINDGEN detection and fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            BINDGEN_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_NAME/clang-tools/linux-x86/bin/bindgen"
            if [ -x "$BINDGEN_BIN" ]; then
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ bindgen exists: $BINDGEN_BIN"
            else
              echo "️ prebuilts bindgen not found, fallback to cargo install bindgen 0.69.5"
              echo "::group::Install bindgen via cargo"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              source "$HOME/.cargo/env"
              cargo install bindgen-cli --version 0.69.5
              echo "::endgroup::"
              BINDGEN_BIN=$(which bindgen)
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ BINDGEN_BIN (cargo): $BINDGEN_BIN"
            fi
          fi
          
          # PAHOLE detection and fallback
          PAHOLE_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$KERNEL_BUILD_TOOLS_PREBUILT_NAME/kernel-build-tools/linux-x86/bin/pahole"
          if [ ! -x "$PAHOLE_BIN" ]; then
            PAHOLE_BIN="$(which pahole 2>/dev/null)"
            [ -x "$PAHOLE_BIN" ] && echo "⚠️ pahole fallback to PATH: $PAHOLE_BIN"
          fi
          if [ -x "$PAHOLE_BIN" ]; then
            echo "✅ pahole exists: $PAHOLE_BIN"
          else
            echo "❌ pahole completely missing, terminating build"
            exit 13
          fi
          
          # RUSTC detection and fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUSTC_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$RUST_TOOLS_PREBUILT_NAME/rust/linux-x86/$RUSTC_DIR_VERSION/bin/rustc"
            if [ ! -x "$RUSTC_BIN" ]; then
              RUSTC_BIN="$(which rustc 2>/dev/null)"
              [ -x "$RUSTC_BIN" ] && echo "⚠️ rustc fallback to PATH: $RUSTC_BIN"
            fi
            if [ -x "$RUSTC_BIN" ]; then
              echo "✅ rustc exists: $RUSTC_BIN"
              export RUSTC="$RUSTC_BIN"
            else
              echo "❌ rustc completely missing and ENABLE_RUST=true, terminating build"
              exit 13
            fi
          fi
          
          LD_WRAPPER=""
          if [ "${{ github.event.inputs.BUILD_NOCACHE }}" = "false" ] && [[ "$KERNEL_VERSION" == 5.* ]]; then
            LDCACHE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/.thinlto-cache"
            mkdir -p "$LDCACHE_DIR"
            LD_WRAPPER="${GITHUB_WORKSPACE}/kernel_workspace/ld-wrapper"
            LLD_BIN="$(command -v ld.lld)"
            if [[ -z "$LLD_BIN" ]]; then
              echo "⚠️ ld.lld not found, cannot create ld-wrapper"
            fi
            printf '#!/bin/bash\nexec "%s" "$@" --thinlto-cache-dir="%s" --thinlto-cache-policy=cache_size_bytes=3g --thinlto-jobs=%s\n' "$LLD_BIN" "$LDCACHE_DIR" "$(nproc --all)" > "$LD_WRAPPER"
            chmod +x "$LD_WRAPPER"
            echo "✅ ld-wrapper created: $LD_WRAPPER (lld=$LLD_BIN, cache=$LDCACHE_DIR)"
          fi
          
          REAL_CLANG_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN/clang"
          CC_WRAPPER="$GITHUB_WORKSPACE/kernel_workspace/cc-wrapper"
          printf '#!/bin/bash\nexec ccache "%s" "$@"\n' "$REAL_CLANG_BIN" > "$CC_WRAPPER"
          chmod +x "$CC_WRAPPER"
          echo "✅ cc-wrapper created: $CC_WRAPPER (clang=$REAL_CLANG_BIN)"
          
          cd ./common
          
          # Remap physical paths
          COMMON_REAL_PATH=$(pwd -P)
          PLATFORM_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          ROOT_REAL_PATH=$(dirname "$PLATFORM_REAL_PATH")
          MAP="-fdebug-prefix-map=$ROOT_REAL_PATH=."
          MPMAP="-fmacro-prefix-map=$ROOT_REAL_PATH=."
          FPMAP="-ffile-prefix-map=$ROOT_REAL_PATH=."
          
          # KCFLAGS
          KCFLAGS="$MAP $FPMAP -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          KCPPFLAGS="$MPMAP"
          
          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="$CC_WRAPPER"
            HOSTCC="$CC_WRAPPER"
            HOSTLD=ld.lld
            PAHOLE="$PAHOLE_BIN"
            KCFLAGS="$KCFLAGS"
            KCPPFLAGS="$KCPPFLAGS"
          )
          
          if [[ -n "${CONFIG_FAKE_DISABLE:-}" ]]; then
            MAKE_ARGS+=(CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE")
          fi
          if [[ -n "$LD_WRAPPER" ]]; then
            MAKE_ARGS+=(LD="$LD_WRAPPER")
          else
            MAKE_ARGS+=(LD=ld.lld)
          fi
          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS+=(LLVM_IAS=1)
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            MAKE_ARGS+=(RUSTC="$RUSTC_BIN")
            MAKE_ARGS+=(BINDGEN="$BINDGEN_BIN")
          fi
          
          make O=out "${MAKE_ARGS[@]}" gki_defconfig --no-print-directory
          
          if [[ "$KERNEL_VERSION" == 5.* ]]; then
            echo "# Set LTO = thin"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi
          
          make O=out "${MAKE_ARGS[@]}" olddefconfig --no-print-directory
          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}"
          ccache -s

      - name: Fallback to Build Kernel
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
            ./kernel_platform/build_with_bazel.py -t ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          else
            LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          fi

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=""
          if [ -d "./kernel_workspace/kernel_platform/common/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ Using unified path compiled by make, successfully found Image file"
            fi
          fi
          if [ -z "$image_path" ] && [ -d "./kernel_workspace/kernel_platform/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ Using official script compilation, successfully found Image file"
            fi
          fi
          if [ -z "$image_path" ]; then
            echo "❌ Image file not found, build failed" >&2
            exit 1
          fi
          if [ -f "$image_path" ]; then
            echo "✅ Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi

      - name: Apply KPX and Replace Image
        if: ${{ github.event.inputs.KPM != 'N/A' }}
        run: |
          KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
          # KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpm"
          KPN_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpn"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
          cd "${OUT_DIR}"
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ]; then
            cp "${KPM_DIR}/patch_linux" .
            chmod +x patch_linux
            ./patch_linux
          else
            cp "${KPN_DIR}/kptools-linux" "${KPN_DIR}/kpimg-linux" .
            chmod +x ./kptools-linux
            ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          fi
          mv -f oImage Image
          cp Image "${GITHUB_WORKSPACE}/AnyKernel3/Image"

      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success&event=push" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
          else
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$ARTIFACT_URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            else
              echo "Failed to fetch artifact URL"
            fi
          fi

      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          wget -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: Download Latest ReSukiSU APK from CI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANAGER_ARTIFACT=Manager-release
          
          echo "Using branch: $KSU_MANAGER_BRANCH"
          echo "Downloading artifact: $MANAGER_ARTIFACT"
          
          run_id=$(gh api "repos/ReSukiSU/ReSukiSU/actions/workflows/build-manager.yml/runs?branch=$KSU_MANAGER_BRANCH&status=success&event=push&per_page=1" --jq '.workflow_runs[0].id' || echo "")
          
          if [[ -z "$run_id" ]]; then
            echo "No successful workflow run found on branch $KSU_MANAGER_BRANCH. Skipping download."
            exit 0
          fi
          artifact_url=$(gh api "repos/ReSukiSU/ReSukiSU/actions/runs/$run_id/artifacts" | jq -r ".artifacts[] | select(.name == \"$MANAGER_ARTIFACT\") | .archive_download_url" | head -n1)
          
          if [[ -z "$artifact_url" ]]; then
            echo "No artifact '$MANAGER_ARTIFACT' found in run $run_id. Skipping download."
            exit 0
          fi
          echo "Downloading from: $artifact_url"
          curl -fL -H "Authorization: token $GITHUB_TOKEN" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url"
          echo "Trying to extract arm64-v8a APK..."
          if unzip -l "${MANAGER_ARTIFACT}.zip" | grep -q "arm64-v8a.*\.apk"; then
            unzip -j "${MANAGER_ARTIFACT}.zip" "*arm64-v8a*.apk" -d ./AnyKernel3/
          else
            echo "arm64-v8a APK not found, extracting generic APK..."
            unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d ./AnyKernel3/
          fi

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ env.ZRAM_ALGO_U && format('_{0}', env.ZRAM_ALGO_U) || '' }}${{ github.event.inputs.KPM == 'KPM' && '_KPM' || github.event.inputs.KPM == 'KPN' && '_KPN' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && '_BBG' || '' }}_ILH${{ github.event.inputs.SCHED_HMBIRD== 'true' && '_HMBIRD' || '' }}${{ github.event.inputs.DROID_SPACES== 'true' && '_DS' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && '_REKER' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && '_LZ4UPD' || '' }}" >> $GITHUB_OUTPUT

      - name: Collect Build Metadata
        id: metadata
        env:
          IN_FILE: ${{ github.event.inputs.FILE }}
          IN_SUFFIX: ${{ github.event.inputs.SUFFIX }}
          IN_LSM_BBG: ${{ github.event.inputs.LSM_BBG }}
          IN_CCM: ${{ github.event.inputs.CCM }}
          IN_NETFILTER: ${{ github.event.inputs.NETFILTER }}
          IN_UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}
          IN_SCHED_HMBIRD: ${{ github.event.inputs.SCHED_HMBIRD }}
          IN_DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}
          IN_RE_KERNEL: ${{ github.event.inputs.RE_KERNEL }}
          IN_LZ4_UPDATE: ${{ github.event.inputs.LZ4_UPDATE }}
          IN_KPM: ${{ github.event.inputs.KPM }}
          IN_ZRAM: ${{ github.event.inputs.ZRAM }}
          IN_KSU_META: ${{ github.event.inputs.KSU_META }}
          IN_SUSFS_META: ${{ github.event.inputs.SUSFS_META }}
          IN_SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}
          IN_SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}
          IN_BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}
          IN_FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}
          FAST_FALLBACK: ${{ steps.fast_build.outputs.fallback }}
          IN_BUILD_NOCACHE: ${{ github.event.inputs.BUILD_NOCACHE }}
          IN_DYNAMIC_REPO: ${{ github.event.inputs.DYNAMIC_REPO }}
          SUFFIX_VALUE: ${{ steps.suffix.outputs.value }}
        run: |
          set -euo pipefail
          echo "::group::Collect Build Metadata"

          KW="$GITHUB_WORKSPACE/kernel_workspace"
          PATCH_CLONE="$KW/Action-Build"
          # Upstream copy of this workflow - linked as the source for defconfig-only features
          UP_YML="https://github.com/Numbersf/Action-Build/blob/ReSukiSU/.github/workflows/Build%20Kernel%20OnePlus.yml"

          # git short/full hash of a cloned repo (empty if the clone is gone)
          gshort() { git -C "$1" rev-parse --short HEAD 2>/dev/null || echo ""; }
          gfull()  { git -C "$1" rev-parse HEAD 2>/dev/null || echo ""; }

          CFG_FILE="${IN_FILE}"
          SFX_INPUT="${IN_SUFFIX}"

          # ------------------------------------------------------------------
          # 0 - Naming scheme (drives tag, title and asset filenames)
          # ------------------------------------------------------------------
          # Marketing codename where known, otherwise the prettified config name.
          case "$CFG_FILE" in
            oneplus_15) DEVICE_CODE="Myron"; DEV_DISPLAY="Myron" ;;
            *)          DEVICE_CODE=$(printf '%s' "${FILE_BASE:-$CFG_FILE}" | tr -d ' ()')
                        DEV_DISPLAY="" ;;
          esac

          # Compact tokens for every applied, toggle-driven patch
          TPLIST=""
          addtok() { TPLIST="${TPLIST:+${TPLIST}-}$1"; }
          if [ "${IN_LSM_BBG}" = "true" ]; then addtok "BBG"; fi
          if [ "${IN_CCM}" = "true" ]; then
            if [ "${KMI:-}" = "android16-6.12" ]; then addtok "BBRv1"; else addtok "BBRv3"; fi
          fi
          if [ "${IN_NETFILTER}" = "true" ]; then addtok "Netext"; fi
          if [ "${IN_UNICODE_BYPASS}" = "true" ]; then addtok "Unicode"; fi
          if [ "${IN_SCHED_HMBIRD}" = "true" ]; then addtok "HMBIRD"; fi
          if [ "${IN_DROID_SPACES}" = "true" ]; then addtok "DS"; fi
          if [ "${IN_RE_KERNEL}" = "true" ]; then addtok "REKER"; fi
          if [ "${IN_LZ4_UPDATE}" = "true" ]; then addtok "LZ4UPD"; fi
          case "${IN_KPM}" in
            KPM) addtok "KPM" ;;
            KPN) addtok "KPN" ;;
          esac
          if [[ "${IN_ZRAM}" == 1* ]]; then
            if [ -n "${ZRAM_ALGO_U:-}" ]; then addtok "ZRAM_${ZRAM_ALGO_U}"; else addtok "ZRAM"; fi
          fi
          TPLIST_PRETTY=$(printf '%s' "$TPLIST" | sed 's/-/ + /g')

          # ------------------------------------------------------------------
          # 1 - Build Targets
          # ------------------------------------------------------------------
          # "Intended for" row only for configs with a verified marketing identity
          INTENDED_ROW=""
          if [ "$CFG_FILE" = "oneplus_15" ]; then
            INTENDED_ROW="Redmi K90 Pro Max / Poco F8 Ultra (myron)"
          fi

          # Pretty device name only: FILE_BASE (OnePlus15) -> "OnePlus 15"
          CFG_LABEL=$(printf '%s' "${FILE_BASE:-$CFG_FILE}" | sed -E 's/([A-Za-z])([0-9])/\1 \2/g')

          # Full kernel release string: prefer the file the build actually produced
          KREL=""
          OUT_DIR="$KW/kernel_platform/out"
          KREL_FILE=$({ find "$OUT_DIR" -type f -name kernel.release 2>/dev/null || true; } | head -n 1)
          if [ -z "$KREL_FILE" ]; then
            KREL_FILE=$({ find "$KW" -maxdepth 12 -type f -name kernel.release 2>/dev/null || true; } | head -n 1)
          fi
          if [ -n "$KREL_FILE" ]; then
            KREL=$(tr -d '[:space:]' < "$KREL_FILE")
            KREL_ROW="\`${KREL}\` (read from \`${KREL_FILE#"$GITHUB_WORKSPACE"/}\`)"
          elif [ "$SFX_INPUT" = "-1" ]; then
            KREL_ROW="Not pinned (SUFFIX = -1 leaves stock, git-derived setlocalversion output)"
          else
            KREL="${CKERNEL_VERSION}-${KANDROID_VERSION}-${EFFECTIVE_SUFFIX:-}"
            KREL_ROW="\`${KREL}\` (reconstructed: kernel version + \`${KANDROID_VERSION}\` + suffix)"
          fi

          if [ -n "${DKERNEL_VERSION:-}" ]; then
            SUBLVL_ROW="Spoofed - \`${DKERNEL_VERSION}\` rebuilt as \`${CKERNEL_VERSION}\`"
          else
            SUBLVL_ROW="No spoof - source SUBLEVEL kept (\`${CKERNEL_VERSION}\`)"
          fi

          case "$SFX_INPUT" in
            -1) SUFFIX_ROW="Disabled (SUFFIX = -1) - setlocalversion left stock (git-derived \`-g<hash>\` style suffix)" ;;
            "")  SUFFIX_ROW="Auto-generated RAND_STR \`${EFFECTIVE_SUFFIX:-not captured}\` - pseudo-official format \`<N>-o-g<hash>\`: \`N\` = random 0-10 (mimics commits since tag), \`o\` = fixed literal borrowed from the OEM tag part, \`g<14 hex>\` = random 7-byte hash" ;;
            *)   SUFFIX_ROW="Custom (\`${SFX_INPUT}\`) - injected verbatim via setlocalversion" ;;
          esac

          # Page title, release tag and release title
          TITLE="${CFG_LABEL}"
          if [ -n "$DEV_DISPLAY" ]; then TITLE="${TITLE} (${DEV_DISPLAY})"; fi

          NAME_BASE="${DEVICE_CODE}-${CKERNEL_VERSION}"
          if [ -n "${EFFECTIVE_SUFFIX:-}" ]; then NAME_BASE="${NAME_BASE}-${EFFECTIVE_SUFFIX}"; fi
          if [ -n "$TPLIST" ]; then NAME_BASE="${NAME_BASE}-${TPLIST}"; fi
          TAG=$(printf '%s' "$NAME_BASE" | tr ' /' '__')

          REL_TITLE="$TITLE"
          if [ -n "$KREL" ]; then REL_TITLE="${REL_TITLE} · ${KREL}"; fi
          if [ -n "$TPLIST_PRETTY" ]; then REL_TITLE="${REL_TITLE} · ${TPLIST_PRETTY}"; fi

          case "$TAG" in
            ""|*[[:space:]]*) echo "::error::Invalid release tag '$TAG'"; exit 1 ;;
          esac

          # ------------------------------------------------------------------
          # 2 - Manager / Modules
          # ------------------------------------------------------------------
          KSU_DIR="$KW/kernel_platform/KernelSU"
          KSU_S=$(gshort "$KSU_DIR")
          KSU_F=$(gfull "$KSU_DIR")
          KSU_META_IN="${IN_KSU_META}"
          KSU_MANUAL="${KSU_META_IN##*/}"
          KSU_TAG=$(printf '%s' "$KSU_META_IN" | cut -d/ -f3)
          if [ -n "$KSU_MANUAL" ]; then
            KSU_LATEST="No (pinned to \`${KSU_MANUAL}\`)"
          else
            KSU_LATEST="Yes"
          fi
          if ls "$GITHUB_WORKSPACE"/AnyKernel3/*.apk >/dev/null 2>&1; then
            KSU_APK="Yes (bundled into AnyKernel3)"
          else
            KSU_APK="No"
          fi
          if [ -n "$KSU_F" ]; then
            KSU_CMT="[${KSU_S}](https://github.com/ReSukiSU/ReSukiSU/commit/${KSU_F})"
          else
            KSU_CMT="N/A"
          fi
          KSU_ROW="manager/builtin branches: \`${KSU_MANAGER_BRANCH}\` / \`${KSU_BUILTIN_BRANCH}\` - latest: ${KSU_LATEST} - commit: ${KSU_CMT} - integration: [\`setup.sh\`](https://github.com/ReSukiSU/ReSukiSU/blob/${KSU_MANAGER_BRANCH}/kernel/setup.sh) - manager APK: ${KSU_APK} - source: [ReSukiSU CI](https://github.com/cctv18/ReSukiSU_CI/releases)"
          if [ -n "$KSU_TAG" ]; then
            KSU_ROW="${KSU_ROW} - custom tag: \`${KSU_TAG}\`"
          fi

          case "${IN_KPM}" in
            KPM)
              KPM_ROW="KPM - in-kernel KPM support (\`CONFIG_KPM=y\`), Image post-processed with \`patch_linux\` from [ShirkNeko/SukiSU_patch](https://github.com/ShirkNeko/SukiSU_patch)"
              ;;
            KPN)
              KPM_ROW="KPN - kpimg embedded into the Image via \`kptools\` ([Action-Build patches/kpn](https://github.com/Numbersf/Action-Build/tree/ReSukiSU/patches/kpn))"
              ;;
            *)
              KPM_ROW="N/A - no KernelPatch post-processing"
              ;;
          esac

          if [ "${IN_SUSFS_META}" != "-1" ]; then
            SUSFS_BRANCH="gki-${KANDROID_VERSION}-${KERNEL_VERSION}"
            if [ "${IN_SUSFS_DEV}" = "true" ]; then
              SUSFS_BRANCH="${SUSFS_BRANCH}-dev"
              SUSFS_DEV_FLAG="Yes"
            else
              SUSFS_DEV_FLAG="No"
            fi
            S_DIR="$KW/susfs4ksu"
            S_S=$(gshort "$S_DIR")
            S_F=$(gfull "$S_DIR")
            if [ -n "$S_F" ]; then
              S_CMT="[${S_S}](https://gitlab.com/simonpunk/susfs4ksu/-/commit/${S_F})"
              S_REF="$S_F"
            else
              S_CMT="N/A"
              S_REF="$SUSFS_BRANCH"
            fi
            SUSFS_PATCH_FILE="50_add_susfs_in_gki-${KANDROID_VERSION}-${KERNEL_VERSION}.patch"
            SUSFS_ROW="Enabled - branch \`${SUSFS_BRANCH}\` @ ${S_CMT} - patch: [\`${SUSFS_PATCH_FILE}\`](https://gitlab.com/simonpunk/susfs4ksu/-/blob/${S_REF}/kernel_patches/${SUSFS_PATCH_FILE}) - DEV branch: ${SUSFS_DEV_FLAG}"
            SM="${IN_SUSFS_META}"
            if [ -n "$SM" ]; then
              if printf '%s' "$SM" | grep -Eq '^[0-9]+$'; then
                SUSFS_ROW="${SUSFS_ROW} - revision: rolled back \`${SM}\` commits from branch HEAD"
              else
                SUSFS_ROW="${SUSFS_ROW} - revision pinned to \`${SM}\`"
              fi
            else
              SUSFS_ROW="${SUSFS_ROW} - revision: latest upstream"
            fi
            case "${IN_SUSFS_CI}" in
              CI)
                SUSFS_MOD_ROW="CI build - latest \`v1.5.2+\` artifact from [sidex15/susfs4ksu-module](https://github.com/sidex15/susfs4ksu-module), bundled into AnyKernel3"
                ;;
              Release)
                SUSFS_MOD_ROW="Stable release from [sidex15/ksu_module_susfs](https://github.com/sidex15/ksu_module_susfs/releases), bundled into AnyKernel3"
                ;;
              *)
                SUSFS_MOD_ROW="Not bundled (SUSFS_CI = N/A - the manager already ships SuSFS support)"
                ;;
            esac
          else
            SUSFS_ROW="Disabled (SUSFS_META = -1)"
            SUSFS_MOD_ROW="Not applicable (kernel SuSFS disabled)"
          fi

          # ------------------------------------------------------------------
          # 3 - Build-Time Configuration
          # ------------------------------------------------------------------
          if [ "${IN_BUILD_TIME}" = "-1" ]; then
            BT_ROW="Disabled (-1) - default kernel timestamps"
          else
            BT_ROW="\`${KBUILD_BUILD_TIMESTAMP:-not captured}\`"
          fi

          if [ "${IN_FAST_BUILD}" = "true" ]; then
            if [ "${FAST_FALLBACK}" = "true" ]; then
              FB_ROW="Requested, but the FAST path was unavailable - fell back to the official build script"
            else
              FB_ROW="Yes (direct make path)"
            fi
          else
            FB_ROW="No (official build script)"
          fi

          if [ "${IN_BUILD_NOCACHE}" = "true" ]; then
            CACHE_ROW="Disabled for this build (BUILD_NOCACHE)"
          else
            if [ "${IN_FAST_BUILD}" = "true" ]; then
              CACHE_OPT="\`-O2\` (KCFLAGS)"
            else
              CACHE_OPT="toolchain defaults"
            fi
            if [[ "${KERNEL_VERSION:-}" == 5.* ]] && [ "${IN_FAST_BUILD}" = "true" ]; then
              CACHE_TLTO="Yes (thinlto-cache + ld-wrapper)"
            else
              CACHE_TLTO="No (the dedicated ThinLTO cache is only wired for 5.x fast builds)"
            fi
            CACHE_ROW="Enabled - ccache (max 5G) at \`${CCACHE_DIR:-}\` - opt: ${CACHE_OPT} - ThinLTO cache: ${CACHE_TLTO}"
          fi

          # ------------------------------------------------------------------
          # 4 - Patches Applied (sources point at the exact .patch/.sh files)
          # ------------------------------------------------------------------
          if [ "${IN_LSM_BBG}" = "true" ]; then
            BBG_ROW="Enabled - LSM baseband/critical-partition write protection, applied by [\`setup.sh\`](https://github.com/vc-teahouse/Baseband-guard/blob/main/setup.sh) (executed from branch \`main\` at build time)"
          else
            BBG_ROW="Not enabled"
          fi

          if [ "${IN_NETFILTER}" = "true" ]; then
            NETFILTER_ROW="Enabled - re-enables netfilter options stripped from GKI defconfigs (ipset \`CONFIG_IP_SET\` family, IPv6 NAT, TTL/HopLimit targets and matches), needed by firewall/ad-block/VPN apps - defconfig fragment applied directly by the build workflow (no external patch) - source: [\`Build Kernel OnePlus.yml\`](${UP_YML})"
          else
            NETFILTER_ROW="Not enabled"
          fi

          if [ "${IN_CCM}" = "true" ]; then
            if [ "${KMI:-}" = "android16-6.12" ]; then
              NET_ROW="Enabled - BBRv1 + ECN only (defconfig: \`CONFIG_TCP_CONG_BBR\`, \`CONFIG_IP_ECN\` / \`CONFIG_TCP_ECN\` / \`CONFIG_IPV6_ECN\`) - no BBRv3 backport exists for \`android16-6.12\`, so no congestion-control patch is applied - source: [\`Build Kernel OnePlus.yml\`](${UP_YML})"
            else
              NET_ROW="Enabled - BBRv1 + BBRv3 + ECN via [\`0001-net-tcp-backport-BBRv3-to-${KMI}.patch\`](https://github.com/Numbersf/Action-Build/blob/ReSukiSU/patches/bbrv3/0001-net-tcp-backport-BBRv3-to-${KMI}.patch) from [Numbersf/Action-Build patches/bbrv3](https://github.com/Numbersf/Action-Build/tree/ReSukiSU/patches/bbrv3)"
            fi
          else
            NET_ROW="Not enabled"
          fi

          if [ "${IN_UNICODE_BYPASS}" = "true" ]; then
            if [ "${VERSIONLEVEL:-6}" -lt 6 ]; then
              UNI_FILE="unicode_bypass_fix_6.1-.patch"
              UNI_V="6.1- (pre-6.1 kernels)"
            else
              UNI_FILE="unicode_bypass_fix_6.1+.patch"
              UNI_V="6.1+ (6.1 and newer)"
            fi
            UNI_ROW="Enabled - fs/unicode invisible code-point read bypass fix, variant \`${UNI_V}\` - patch: [\`${UNI_FILE}\`](https://github.com/Numbersf/Action-Build/blob/ReSukiSU/patches/${UNI_FILE})"
          else
            UNI_ROW="Not enabled"
          fi

          CLEAN_FILE=$(printf '%s' "$CFG_FILE" | sed 's/_bak//')
          if [ "${IN_SCHED_HMBIRD}" = "true" ]; then
            SD_DIR="$KW/kernel_platform/common/SCHED_PATCH"
            SD_S=$(gshort "$SD_DIR")
            SD_F=$(gfull "$SD_DIR")
            if [ -n "$SD_F" ]; then
              SCHED_LINK="[Numbersf/SCHED_PATCH @ ${SD_S}](https://github.com/Numbersf/SCHED_PATCH/tree/${SD_F})"
              FENG_URL="https://github.com/Numbersf/SCHED_PATCH/blob/${SD_F}/fengchi_${CLEAN_FILE}.patch"
            else
              SCHED_LINK="[Numbersf/SCHED_PATCH](https://github.com/Numbersf/SCHED_PATCH/tree/${CPU})"
              FENG_URL="https://github.com/Numbersf/SCHED_PATCH/blob/${CPU}/fengchi_${CLEAN_FILE}.patch"
            fi
            FENG_ROW="Enabled - oplus Fengchi (HMBIRD v1.0) scheduler, [\`fengchi_${CLEAN_FILE}.patch\`](${FENG_URL}) from ${SCHED_LINK}"
          else
            HMB_PRESENT="no"
            if ls -d "$KW/kernel_platform/common"/kernel/sched/hmbird* "$KW/kernel_platform/common"/vendor/oplus/kernel/cpu/sched_ext/hmbird* >/dev/null 2>&1; then
              HMB_PRESENT="yes"
            fi
            if [ "${VERSIONLEVEL:-0}" -gt 6 ] || { [ "${VERSIONLEVEL:-0}" -eq 6 ] && [ "${PATCHLEVEL:-0}" -ge 6 ]; }; then
              FENG_ROW="Not enabled (SCHED_HMBIRD off) - the OGKI to GKI conversion fallback applied [\`hmbird_patch.patch\`](https://github.com/Numbersf/Action-Build/blob/ReSukiSU/patches/hmbird_patch.patch) (Fengchi code present in final tree: ${HMB_PRESENT}; the dedicated Fengchi patch requires a \`${CPU}\` branch in Numbersf/SCHED_PATCH)"
            else
              FENG_ROW="Not enabled"
            fi
          fi

          if [ "${IN_DROID_SPACES}" = "true" ]; then
            NT_COMPAT=""
            if [ -n "${KMI:-}" ]; then
              if [ -f "$PATCH_CLONE/patches/ntsync/ntsync_compat_${KMI}_${ANDROID_SHORT_VERSION}.patch" ]; then
                NT_COMPAT="ntsync_compat_${KMI}_${ANDROID_SHORT_VERSION}.patch"
              else
                NT_COMPAT="ntsync_compat_${KMI}.patch"
              fi
            fi
            if [[ "$CFG_FILE" == oneplus_10r* ]]; then
              NT_COMPAT="ntsync_compat_android12-5.10_14.patch"
            fi
            if [ -n "$NT_COMPAT" ]; then
              DS_ROW="Enabled - lightweight container support: ntsync driver + KABI-safe SYSVIPC integration, applied via [\`ntsync_base.patch\`](https://github.com/Numbersf/Action-Build/blob/ReSukiSU/patches/ntsync/ntsync_base.patch) + [\`${NT_COMPAT}\`](https://github.com/Numbersf/Action-Build/blob/ReSukiSU/patches/ntsync/${NT_COMPAT}) + [\`ghost-task-for-midas.patch\`](https://github.com/Numbersf/Action-Build/blob/ReSukiSU/patches/ghost-task-for-midas.patch) (KABI edits applied inline by the build workflow)"
            else
              DS_ROW="Enabled - lightweight container support: ntsync driver + KABI-safe SYSVIPC integration ([patches/ntsync](https://github.com/Numbersf/Action-Build/tree/ReSukiSU/patches/ntsync))"
            fi
          else
            DS_ROW="Not enabled"
          fi

          if [ "${IN_RE_KERNEL}" = "true" ]; then
            RK_DIR="$KW/Re-Kernel"
            RK_S=$(gshort "$RK_DIR")
            RK_F=$(gfull "$RK_DIR")
            if [ -n "$RK_F" ]; then
              REKER_ROW="Enabled - binder IPC optimization LKM (\`CONFIG_REKERNEL\`), [\`LKM-Source\`](https://github.com/Sakion-Team/Re-Kernel/tree/${RK_F}/LKM-Source) from [Sakion-Team/Re-Kernel @ ${RK_S}](https://github.com/Sakion-Team/Re-Kernel/tree/${RK_F})"
            else
              REKER_ROW="Enabled - binder IPC optimization LKM (\`CONFIG_REKERNEL\`), [\`LKM-Source\`](https://github.com/Sakion-Team/Re-Kernel/tree/main/LKM-Source) from [Sakion-Team/Re-Kernel](https://github.com/Sakion-Team/Re-Kernel)"
            fi
          else
            REKER_ROW="Not enabled"
          fi

          if [ "${IN_LZ4_UPDATE}" = "true" ]; then
            LZ_DIR="$KW/lz4_oplus"
            LZ_S=$(gshort "$LZ_DIR")
            LZ_F=$(gfull "$LZ_DIR")
            if [ -n "$LZ_F" ]; then
              LZ4_ROW="Enabled - in-kernel LZ4 upgraded to latest upstream via [\`apply_lz4_oplus.sh\`](https://github.com/Numbersf/lz4_oplus/blob/${LZ_F}/apply_lz4_oplus.sh) from [Numbersf/lz4_oplus @ ${LZ_S}](https://github.com/Numbersf/lz4_oplus/tree/${LZ_F})"
            else
              LZ4_ROW="Enabled - in-kernel LZ4 upgraded to latest upstream via [\`apply_lz4_oplus.sh\`](https://github.com/Numbersf/lz4_oplus/blob/main/apply_lz4_oplus.sh) from [Numbersf/lz4_oplus](https://github.com/Numbersf/lz4_oplus)"
            fi
          else
            LZ4_ROW="Not enabled"
          fi

          if [[ "${IN_ZRAM}" == 1* ]]; then
            SIZE_H=$(numfmt --to=iec "${ZRAM_SIZE:-0}" 2>/dev/null || printf '%s' "${ZRAM_SIZE:-}")
            SU_S=$(gshort "$KW/SukiSU_patch")
            SU_F=$(gfull "$KW/SukiSU_patch")
            if [ -n "$SU_F" ]; then
              SU_REF="$SU_F"
              SU_LINK="[ShirkNeko/SukiSU_patch @ ${SU_S}](https://github.com/ShirkNeko/SukiSU_patch/tree/${SU_F})"
            else
              SU_REF="main"
              SU_LINK="[ShirkNeko/SukiSU_patch](https://github.com/ShirkNeko/SukiSU_patch)"
            fi
            ZDIR="$KW/SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION:-}"
            if [ -d "$ZDIR" ]; then
              ZRAM_ROW="Built - in-tree \`zram.ko\` with lz4kd/lz4k_oplus support: [\`lz4kd.patch\`](https://github.com/ShirkNeko/SukiSU_patch/blob/${SU_REF}/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch) + [\`lz4k_oplus.patch\`](https://github.com/ShirkNeko/SukiSU_patch/blob/${SU_REF}/other/zram/zram_patch/${KERNEL_VERSION}/lz4k_oplus.patch) from ${SU_LINK} - algorithm \`${ZRAM_ALGO:-n/a}\`, size \`${ZRAM_SIZE:-n/a}\` bytes (${SIZE_H})"
            else
              ZRAM_ROW="Built - in-tree \`zram.ko\` - algorithm \`${ZRAM_ALGO:-n/a}\`, size \`${ZRAM_SIZE:-n/a}\` bytes (${SIZE_H}) - note: no lz4k patches published for \`${KERNEL_VERSION}\` in ${SU_LINK} (upstream covers 5.10 to 6.6)"
            fi
          else
            ZRAM_ROW="Not built (ZRAM disabled)"
          fi

          # ------------------------------------------------------------------
          # 5 - Manifest Source
          # ------------------------------------------------------------------
          MANIFEST_URL="https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}/tree/${MANIFEST_BRANCH}"

          # ------------------------------------------------------------------
          # assemble the markdown body
          # ------------------------------------------------------------------
          BODY="$(mktemp)"
          row() { printf '| %s | %s |\n' "$1" "$2" >> "$BODY"; }

          {
            printf '# %s - Kernel Build\n\n' "$TITLE"
            printf '> Automated release generated from **workflow run [#%s](https://github.com/%s/actions/runs/%s)** on branch `%s`.\n\n' "$GITHUB_RUN_ID" "${GITHUB_REPOSITORY}" "$GITHUB_RUN_ID" "${GITHUB_REF_NAME}"
            printf '## 1 - Build Targets\n\n| Field | Value |\n| --- | --- |\n'
          } >> "$BODY"
          if [ -n "$INTENDED_ROW" ]; then row "Intended for" "$INTENDED_ROW"; fi
          row "Configuration file" "$CFG_LABEL"
          row "Kernel version" "\`${CKERNEL_VERSION}\` (KMI: \`${KMI}\`, Android lib branch: \`${KANDROID_VERSION}\`)"
          row "Full kernel release" "$KREL_ROW"
          row "Kernel suffix" "$SUFFIX_ROW"
          row "SUBLEVEL spoof" "$SUBLVL_ROW"

          printf '\n## 2 - Manager / Modules\n\n| Field | Value |\n| --- | --- |\n' >> "$BODY"
          row "ReSukiSU" "$KSU_ROW"
          row "KPM implementation method" "$KPM_ROW"
          row "SuSFS kernel patch" "$SUSFS_ROW"
          row "SuSFS runtime module" "$SUSFS_MOD_ROW"

          printf '\n## 3 - Build-Time Configuration\n\n| Field | Value |\n| --- | --- |\n' >> "$BODY"
          row "Build time used" "$BT_ROW"
          row "Ultra-fast build" "$FB_ROW"
          row "Build cache" "$CACHE_ROW"

          printf '\n## 4 - Patches Applied\n\n| Patch | Value |\n| --- | --- |\n' >> "$BODY"
          row "LSM_BBG (Baseband Guard)" "$BBG_ROW"
          row "Netfilter extensions" "$NETFILTER_ROW"
          row "Network (BBR + ECN)" "$NET_ROW"
          row "Unicode invisible code-point bypass" "$UNI_ROW"
          row "Fengchi (HMBIRD v1.0)" "$FENG_ROW"
          row "DroidSpaces (ntsync + SYSVIPC)" "$DS_ROW"
          row "Re-Kernel" "$REKER_ROW"
          row "LZ4 upstream upgrade" "$LZ4_ROW"
          row "ZRAM.ko" "$ZRAM_ROW"

          printf '\n## 5 - Manifest Source\n\n| Field | Value |\n| --- | --- |\n' >> "$BODY"
          row "Owner" "${MANIFEST_REPO}"
          row "Repository" "${MANIFEST_REPO_NAME}"
          row "Resolved branch" "\`${MANIFEST_BRANCH}\`"
          row "URL" "${MANIFEST_URL}"
          row "Requested owner (DYNAMIC_REPO)" "\`${IN_DYNAMIC_REPO}\`"

          printf '\n## 6 - Naming Identifiers\n\n| Identifier | Value |\n| --- | --- |\n' >> "$BODY"
          row "Release tag" "\`${TAG}\`"
          row "Release title" "${REL_TITLE}"
          row "AK3 asset" "\`AnyKernel3_${TAG}.zip\`"
          if [[ "${IN_ZRAM}" == 1* ]]; then
            row "ZRAM module asset" "\`ZRAM-Module_${TAG}.zip\`"
          fi
          row "Workflow artifact suffix" "\`${SUFFIX_VALUE}\` (unchanged upstream naming)"
          {
            printf '\nPatch tokens in tag and asset names: %s\n' "${TPLIST_PRETTY:-none}"
            printf 'Token legend: BBG (Baseband Guard), BBRv1/BBRv3 (TCP congestion control), Netext (netfilter extensions), Unicode (fs/unicode bypass), HMBIRD (Fengchi scheduler), DS (DroidSpaces), REKER (Re-Kernel), LZ4UPD (upstream LZ4), KPM/KPN (KernelPatch method), ZRAM_<algo> (zram.ko algorithm).\n'
            printf '\n%s\n' '---'
            printf 'Built via [Numbersf/Action-Build (ReSukiSU)](https://github.com/Numbersf/Action-Build/tree/ReSukiSU) - run `%s`.\n' "$GITHUB_RUN_ID"
          } >> "$BODY"

          # log the body for review in the Actions log
          cat "$BODY"
          if [ ! -s "$BODY" ]; then
            echo "::error::Release body came out empty - aborting"
            exit 1
          fi

          {
            echo "tag_name=$TAG"
            echo "name=$REL_TITLE"
            echo "release_body<<EOF_METADATA_V3"
            cat "$BODY"
            echo "EOF_METADATA_V3"
          } >> "$GITHUB_OUTPUT"
          echo "Metadata collected - tag: $TAG"
          echo "Metadata collected - title: $REL_TITLE"
          echo "::endgroup::"
          
      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          name: AnyKernel3_ReSukiSU_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}(${{ env.CKERNEL_VERSION }})${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*

      - name: Extract and Process ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/')
        id: zram_find
        run: |
          set -e
          ZRAM_ZIP="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/ZRAM.zip"
          
          if [ ! -f "$ZRAM_ZIP" ]; then
            echo "❌ ZRAM.zip not found: $ZRAM_ZIP"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          unzip "$ZRAM_ZIP" -d ZRAM-Module
          
          CONFIG_PROP="ZRAM-Module/config.prop"
          if [ -f "$CONFIG_PROP" ]; then
            echo "Modifying config.prop"
            sed -i "s/^ZRAM_ALGO=.*/ZRAM_ALGO=${ZRAM_ALGO}/" "$CONFIG_PROP"
            sed -i "s/^ZRAM_SIZE=.*/ZRAM_SIZE=${ZRAM_SIZE}/" "$CONFIG_PROP"
            echo "ZRAM_ALGO=${ZRAM_ALGO}"
            echo "ZRAM_SIZE=${ZRAM_SIZE}"
          else
            echo "❌ config.prop not found"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          target="./ZRAM-Module/zram/zram.ko"
          echo "Searching for zram.ko module file..."
          search_paths=(
            "./kernel_workspace/kernel_platform/out"
            "./kernel_workspace/device/qcom"
          )
          zram_path=""
          for path in "${search_paths[@]}"; do
            if [ -d "$path" ]; then
              zram_path=$(find "$path" -type f -name "zram.ko" | head -n 1)
              [ -n "$zram_path" ] && break
            fi
          done
          if [ -z "$zram_path" ]; then
            zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" | head -n 1)
          fi
          if [ -n "$zram_path" ] && [ -f "$zram_path" ]; then
            echo "✅ zram.ko file finally located at: $zram_path"
            install -D "$zram_path" "$target"
          else
            echo "❌ zram.ko file not found, it may be an unsupported kernel version or build failure"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Upload ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/') && steps.zram_find.outputs.upload != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
          path: ZRAM-Module/*

      - name: Prepare Release Assets
        id: release_assets
        if: ${{ github.event.inputs.CREATE_RELEASE == 'true' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          SAFE_TAG=$(printf '%s' "${{ steps.metadata.outputs.tag_name }}" | tr ' ' '_')
          AK3_ZIP="AnyKernel3_${SAFE_TAG}.zip"
          ( cd AnyKernel3 && zip -qr "${GITHUB_WORKSPACE}/${AK3_ZIP}" . )
          if [ ! -f "${GITHUB_WORKSPACE}/${AK3_ZIP}" ]; then
            echo "::error::${AK3_ZIP} was not created"
            exit 1
          fi
          echo "ak3_zip=${GITHUB_WORKSPACE}/${AK3_ZIP}" >> "$GITHUB_OUTPUT"
          if [ -d "ZRAM-Module" ] && [ -n "$(ls -A ZRAM-Module 2>/dev/null)" ]; then
            ZRAM_ZIP="ZRAM-Module_${SAFE_TAG}.zip"
            ( cd ZRAM-Module && zip -qr "${GITHUB_WORKSPACE}/${ZRAM_ZIP}" . )
            echo "zram_zip=${GITHUB_WORKSPACE}/${ZRAM_ZIP}" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Check Cache Size Before Save
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: cache_size_check
        run: |
          check_size() {
            local CACHE_DIR="$1"
            local CACHE_NAME="$2"
            if [[ ! -d "$CACHE_DIR" ]]; then
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
              return
            fi
            SIZE_MB=$(du -sm "$CACHE_DIR" | cut -f1)
            echo "$CACHE_DIR size: ${SIZE_MB}MB"
            if (( SIZE_MB >= 5 )); then
              echo "${CACHE_NAME}_save=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Cache Warning::$CACHE_NAME is less than 5MB, skipping save"
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_size "${{ env.CCACHE_DIR }}" "ccache"
          check_size "${{ github.workspace }}/kernel_workspace/.thinlto-cache" "thinlto"

      - name: Save Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && steps.cache_size_check.outputs.ccache_save == 'true' && steps.restore-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.8

      - name: Save ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' && steps.cache_size_check.outputs.thinlto_save == 'true' && steps.restore-thinlto.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-16.8

      - name: Post-build Disk Check
        run: df -h
        
      - name: Publish GitHub Release
        if: ${{ github.event.inputs.CREATE_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag_name }}
          name: ${{ steps.metadata.outputs.name }}
          body: ${{ steps.metadata.outputs.release_body }}
          target_commitish: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.release_assets.outputs.ak3_zip }}
            ${{ steps.release_assets.outputs.zram_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
